name: Tests

# The suite has only ever run on the developer's Windows machine, and this
# application ships installers for three platforms. Every platform-shaped defect
# so far was found by accident rather than by testing: two settings tests
# comparing the same file spelled with different separators, `QFont("Helvetica")`
# silently resolving to Tahoma, and a Qt platform plugin with an empty font
# database. None of those are visible from one box.
#
# Packaging is deliberately absent for now. PyInstaller across three platforms
# belongs in its own workflow, and a frozen binary is only worth building if
# something then launches it -- which needs a self-test entry point the
# application does not have yet.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the state of the other two, which
      # is the whole point here: the failures worth catching are platform-only.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Full history, not the default shallow clone. `__build__` is
      # `git rev-list --count HEAD`, which returns 1 in a shallow clone -- so
      # anything built or reported from such a checkout calls itself build 1.
      # tests/test_version.py would still pass, because it reads git the same
      # way and the two agree on the lie.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          # The floor from pyproject.toml's requires-python. It happens to be
          # the newest release as well, so there is nothing older to test yet.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The PySide6 wheel brings Qt but not the system libraries Qt links
      # against. Offscreen needs them too: it replaces the window system, not
      # the GUI stack underneath, so a missing libEGL fails before the first
      # test runs. Only Linux -- the macOS and Windows wheels are
      # self-contained. This is the QtWebEngine list from the ports repo minus
      # what Chromium wanted; nothing here uses WebEngine.
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install
        run: pip install -e ".[dev]"

      # tests/test_i18n.py::TestTranslations skips itself when build/mo is
      # absent, so without this CI runs green while proving nothing about the
      # 33 catalogues -- the largest thing inherited from upstream, and the
      # easiest to orphan by rewording one menu label.
      - name: Compile the message catalogues
        run: python tools/build_mo.py

      # No ruff gate yet. `ruff check` reports 106 findings on this tree today,
      # 98 of them auto-fixable import ordering in the test modules. Turning
      # that on is a decision to make deliberately, with a one-time cleanup
      # commit of its own -- not something to discover as a red first run.
      #
      # conftest.py forces the offscreen platform itself, before Qt is
      # imported, and settings are isolated to a temp ini keyed by process id,
      # so nothing here needs a display or touches a real settings store. The
      # environment variable is set anyway so a reader of this file can see
      # what the tests run under.
      #
      # This is not only a re-run of what already passes locally. Two tests
      # skip on the developer's machine because the offscreen platform there
      # has no fonts at all, and they check that a stamped page number is real
      # selectable text rather than outlines. Linux runners have fontconfig, so
      # those two execute here and nowhere else.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
