name: Package

# A build that succeeds is not evidence the application runs. PyInstaller
# decides what to carry by inspecting imports, and it cannot see a Qt plugin, a
# data file or a compiled catalogue -- so the things it drops are exactly the
# things that fail at launch and nowhere else. Both of the faults this would
# have caught were shipped: the message catalogues were unreachable in the
# Windows bundle for every language at once, and the window icon was never set
# because nothing asked for the artwork the spec was already bundling.
#
# Separate from Tests because it is slow and because a red build here means
# something different: the code is fine, the *package* is not.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # The packaging differs per platform far more than the code does -- an
      # icon is a .ico, a .icns and a .desktop entry -- so one platform failing
      # says nothing about the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Full history: `__build__` is the commit count, and a shallow clone
      # would stamp every installer as build 1.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install
        run: pip install -e ".[dev]"

      # The catalogues have to exist before PyInstaller runs, because the spec
      # bundles build/mo and warns rather than fails when it is missing. That
      # warning is easy to miss in a log, and the result is the bundle that
      # ships with no translations at all.
      - name: Compile the message catalogues
        run: python tools/build_mo.py

      - name: Stamp the build number
        run: python tools/gen_version_build.py

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/pdfarranger-qt.spec

      # The point of the whole workflow. --self-test constructs the real
      # window, renders a page through QtPdf, loads a catalogue and finds the
      # icon, then exits non-zero if any of that failed. Offscreen because a
      # runner has no display; everything checked is independent of one.
      - name: Launch it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/pdfarranger-qt/pdfarranger-qt --self-test
        if: runner.os != 'Windows'

      - name: Launch it (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\pdfarranger-qt\pdfarranger-qt.exe --self-test
        if: runner.os == 'Windows'

      - uses: actions/upload-artifact@v7
        with:
          name: pdfarranger-qt-${{ matrix.os }}
          path: dist/
          retention-days: 14
