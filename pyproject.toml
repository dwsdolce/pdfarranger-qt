[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfarranger-qt"
version = "0.1.0"
description = "Merge, split, rearrange, rotate and crop PDF documents"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "David Smith" }]
keywords = ["pdf", "merge", "split", "rotate", "crop", "booklet", "imposition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# **A floor is a version this project has actually tested, not a guess at how
# far back it would work.** CI installs the newest of everything against these
# floors, so anything below them is a compatibility claim no run has ever
# exercised -- and 2026-11-02 showed what that is worth: pikepdf returns
# `dc:creator` as a set up to 10.11 and a list from 10.17, a difference inside
# one major that a floor of >=8.0 silently promised to tolerate. The floors
# are raised when the tested set moves, which is the cost of saying only what
# is true. Measured against the set CI resolved on 2026-11-02, which the
# working venv now matches exactly.
dependencies = [
    # Not >=6.8 any more. 6.11.1 crashes on launch on macOS 27.2, on a
    # use-after-free in `qt_mac_cgImageFormatForImage()`: it builds the colour
    # space
    # in a local `QCFType<CGColorSpaceRef>` and returns a structure holding
    # only the raw pointer, which the QCFType then releases. Before 27.2 the
    # system sRGB colour space was never actually deallocated, so the bug was
    # harmless; now it is a pointer authentication trap in CoreGraphics,
    # reached through *any* `QImage::toCGImage()` -- the wait cursor on
    # startup, but equally every page this reader paints. Reproduced here on
    # 6.11.1 and confirmed gone on 6.11.2, which carries the fix. The floor
    # is above 6.11.2 because it is the tested version and not the oldest
    # workable one; 6.11.2 is recorded as where the fix landed, which is the
    # fact worth keeping whatever the floor says.
    "PySide6>=6.12.0",
    "pikepdf>=10.17.0",
    "img2pdf>=0.6.3",
    # Never imported by name: it arrives as the return type of
    # `pikepdf.PdfImage.as_pil_image()`, which Extract Images already saves to
    # disk. Declared because that is a runtime requirement whatever it looks
    # like, and because compression will use it directly.
    "Pillow>=13.0.0",
    # Material Design Icons as QIcons, and the fonts they come from. Qt's own
    # SP_* standard pixmaps have no glyph for a highlighter, an arrow or a
    # polygon, and render blank on macOS besides.
    "qtawesome>=1.4.2",
    # The loose character box, which is the box a text markup covers: the
    # font's ascent and descent rather than the glyph's ink. Qt PDF is PDFium
    # too, but it links it statically with hidden visibility -- not one
    # FPDF_* symbol is exported -- so there is nothing to call. Measured
    # against Acrobat's own highlights, this reproduces all 42 of their
    # quadrilaterals to within 0.06 points; Qt's ink-tight boxes run 2 to 6
    # points short and vary run by run.
    "pypdfium2>=5.14.0",
    "python-dateutil>=4.0.0",
    "packaging>=26.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    # Also in the packaging extra below, so CI can build without pulling in the
    # test tooling. Here so that one `pip install -e ".[dev]"` covers everything
    # a developer needs, including packaging/build_win.
    "pyinstaller>=6.22.3",
    "babel>=2.18.0",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[project.gui-scripts]
pdfarranger-qt = "pdfarranger_qt.app:main"

[project.urls]
Homepage = "https://github.com/dwsdolce/pdfarranger-qt"

[tool.setuptools.packages.find]
include = ["pdfarranger_qt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pdfarranger_qt"]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
