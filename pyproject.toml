[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfarranger-qt"
version = "0.1.0"
description = "Merge, split, rearrange, rotate and crop PDF documents"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "David Smith" }]
keywords = ["pdf", "merge", "split", "rotate", "crop", "booklet", "imposition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.8",
    "pikepdf>=8.0",
    "img2pdf>=0.4.2",
    "python-dateutil>=2.8",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "ruff>=0.15",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.gui-scripts]
pdfarranger-qt = "pdfarranger_qt.app:main"

[project.urls]
# TODO: point at the new repository once it exists.
Homepage = "https://github.com/dwsdolce/pdfarranger-qt"

[tool.setuptools.packages.find]
include = ["pdfarranger_qt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pdfarranger_qt"]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
